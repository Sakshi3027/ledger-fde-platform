name: ledger

services:
  postgres:
    image: postgres:16
    container_name: ledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger_dev_pw
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: ledger-adminer
    restart: unless-stopped
    ports:
      - "8091:8080"
    depends_on:
      - postgres

volumes:
  postgres_data: